name: Elaina Perception Trigger (Calling)

on:
  repository_dispatch:
    types: [elaina_perception_trigger]
  workflow_dispatch:

concurrency:
  group: elaina-bot
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  perception:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hisou-tenshi/calling-tenshi:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Elaina repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.ELAINA_REPO || 'hinanawitenshi/Elaina' }}
          token: ${{ secrets.ELAINA_BOT_ACTION_TOKEN }}
          fetch-depth: 0
          path: elaina

      - name: "Guard: skip perception if webhook running"
        id: guard_webhook
        env:
          CALLING_REPO: ${{ github.repository }}
          ELAINA_REPO: ${{ secrets.ELAINA_REPO || 'hinanawitenshi/Elaina' }}
          GH_TOKEN_CALLING: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_ELAINA: ${{ secrets.ELAINA_BOT_ACTION_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          out_path = os.environ.get("GITHUB_OUTPUT", "")
          calling_repo = os.environ.get("CALLING_REPO", "")
          elaina_repo = os.environ.get("ELAINA_REPO", "")
          token_calling = os.environ.get("GH_TOKEN_CALLING", "")
          token_elaina = os.environ.get("GH_TOKEN_ELAINA", "")

          if not out_path or (not token_calling and not token_elaina):
            with open(out_path, "a", encoding="utf-8") as f:
              f.write("should_skip=false\n")
            sys.exit(0)

          telegram_workflow_path = ".github/workflows/elaina_telegram_webhook.yml"
          branch = os.environ.get("GITHUB_REF_NAME") or "main"

          def has_telegram_run(repo_full: str, token: str, status: str) -> bool:
            try:
              if not repo_full or not token:
                return False

              owner, name = repo_full.split("/", 1)
              url = (
                f"https://api.github.com/repos/{owner}/{name}"
                f"/actions/runs?per_page=100&branch={branch}&status={status}"
              )
              headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": f"token {token}",
              }
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                data = json.load(resp)
              for r in data.get("workflow_runs", []) or []:
                rid = r.get("id")
                if run_id and str(rid) == str(run_id):
                  continue
                path = (r.get("path") or "")
                if path == telegram_workflow_path or path.endswith("/elaina_telegram_webhook.yml") or path.endswith("/telegram_webhook.yml"):
                  return True
              return False
            except Exception:
              return True

          should_skip = False
          for st in ("in_progress", "queued"):
            if has_telegram_run(calling_repo, token_calling, st) or has_telegram_run(elaina_repo, token_elaina, st):
              should_skip = True
              break

          with open(out_path, "a", encoding="utf-8") as f:
            f.write(f"should_skip={'true' if should_skip else 'false'}\n")
          PY

      - name: Restore schedule KV if this run was skipped
        # 守卫跳过时，Cloudflare Worker 已经把队首从 KV 弹掉了。这里把 elaina 仓库里那份
        # data/perception_schedule.json 的待触发队列重新同步回 KV，让下一次 cron 还能捞起来；
        # 否则这条定时（包括主回复全链失败后登记的 [reply-retry] 近程重试）就此丢失。
        if: steps.guard_webhook.outputs.should_skip == 'true'
        working-directory: elaina
        env:
          PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.ELAINA_PERCEPTION_SCHEDULE_SYNC_URL || secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
          PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.ELAINA_PERCEPTION_SCHEDULE_SYNC_SECRET || secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          try:
              # 优先用公开 helper；老版本仓库（如 Elaina 的副本）没有它时退回内部 loader
              try:
                  from perception_schedule import list_pending_schedule_entries as _list_entries
              except ImportError:
                  from perception_schedule import _load_doc

                  def _list_entries():
                      return (_load_doc().get("entries") or [])
              from perception_schedule import _sync_to_worker_kv

              entries = _list_entries()
              print(f"[schedule-restore] 本次被守卫跳过，重新同步 {len(entries)} 条待触发条目到 KV")
              print(_sync_to_worker_kv(entries))
          except Exception as e:
              print(f"[schedule-restore] 跳过（best-effort）：{type(e).__name__}: {e}")
          PY

      - name: Run Perception Layer
        id: run_perception
        continue-on-error: true
        if: steps.guard_webhook.outputs.should_skip != 'true'
        working-directory: elaina
        env:
          TELEGRAM_TOKEN: ${{ secrets.ELAINA_TG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_BASE_URL: ${{ secrets.FIREWORKS_BASE_URL }}
          FIREWORKS_DEEPSEEK_V4_PRO_MODEL: ${{ secrets.FIREWORKS_DEEPSEEK_V4_PRO_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
          TIMEZONE_OFFSET: ${{ secrets.TIMEZONE_OFFSET }}
          PERCEPTION_SCHEDULED_FORCE: ${{ github.event.client_payload.scheduled_force }}
          PERCEPTION_SCHEDULE_NOTE: ${{ github.event.client_payload.note }}
          PERCEPTION_TRIGGER_AT_MS: ${{ github.event.client_payload.trigger_at_ms }}
          # 感知层里也可能补跑回复引擎（[reply-retry] 近程重试），它登记的定时条目要能同步 KV
          PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.ELAINA_PERCEPTION_SCHEDULE_SYNC_URL || secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
          PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.ELAINA_PERCEPTION_SCHEDULE_SYNC_SECRET || secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
        run: |
          set +e
          git config --global --add safe.directory /__w/Calling/Calling/elaina
          ARGS=""
          if [ "${{ github.event.client_payload.scheduled_force }}" = "true" ]; then
            echo "Scheduled force trigger (Cloudflare KV)."
            ARGS="--scheduled-force"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--force"
          fi
          python -u src/perception_layer.py $ARGS
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "Perception skipped (probability/cooldown); no commit needed."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit and Push Changes (to Elaina repo)
        if: steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'success' && steps.run_perception.outputs.exit_code != '2'
        working-directory: elaina
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "伊蕾娜"
          git config --global user.email "268836736+ZenjinruiNoHisouten@users.noreply.github.com"

          # 鲁棒地添加文件：逐个检查是否存在（不存在就跳过）
          # 清单与 elaina_telegram_webhook.yml 对齐：感知层现在也会补跑回复引擎，
          # 它会写记忆库 / embedding 缓存 / knowledge_base / downloads / 日志。
          for f in Elaina.json data/tenshi_log.json data/perception_schedule.json data/embedding_cache.pkl data/tenshi_memory.db data/knowledge_base.json downloads/ logs/; do
            if [ -e "$f" ]; then
              git add "$f" >/dev/null 2>&1 || true
            fi
          done

          git commit -m "伊蕾娜感知层：世界观测日志 [skip ci]" >/dev/null 2>&1 || true

          for attempt in 1 2 3; do
            if git push origin main >/dev/null 2>&1; then
              exit 0
            fi

            git fetch origin main >/dev/null 2>&1
            if ! git rebase origin/main >/dev/null 2>&1; then
              if [ -n "$(git ls-files -u)" ]; then
                git ls-files -u | awk '{print $4}' | sort -u | while IFS= read -r cf; do
                  if [ -e "$cf" ]; then
                    git checkout --ours -- "$cf" >/dev/null 2>&1 || true
                    git add -- "$cf" >/dev/null 2>&1 || true
                  fi
                done
                git rebase --continue >/dev/null 2>&1 || git rebase --skip >/dev/null 2>&1 || true
              else
                git rebase --abort >/dev/null 2>&1 || true
              fi
            fi
          done

          git push origin main >/dev/null 2>&1

      - name: Build encrypted failure bundle
        if: steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure'
        id: build_failure_bundle
        working-directory: elaina
        env:
          MASTER_KEY_SOURCE: ${{ secrets.MASTER_KEY_SOURCE }}
        run: |
          set -e
          if [ -z "$MASTER_KEY_SOURCE" ]; then
            echo "MASTER_KEY_SOURCE not set; skip encrypted failure bundle."
            exit 0
          fi
          bundle_name="elaina_failure_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.tar.gz"
          enc_name="${bundle_name}.enc"
          tar -czf "/tmp/${bundle_name}" \
            data/tenshi_log.json \
            data/knowledge_base.json \
            logs/debug.log \
            logs/llm_trace.jsonl 2>/dev/null || true
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "/tmp/${bundle_name}" \
            -out "${GITHUB_WORKSPACE}/${enc_name}" \
            -pass pass:"${MASTER_KEY_SOURCE}" >/dev/null 2>&1
          rm -f "/tmp/${bundle_name}"
          echo "enc_file=${enc_name}" >> "$GITHUB_OUTPUT"

      - name: Push encrypted failure bundle to Elaina
        if: (steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure') && steps.build_failure_bundle.outputs.enc_file != ''
        id: push_failure_bundle
        working-directory: elaina
        run: |
          set +e
          enc_file="${{ steps.build_failure_bundle.outputs.enc_file }}"
          mkdir -p secure_failures
          cp "${GITHUB_WORKSPACE}/${enc_file}" "secure_failures/${enc_file}"

          git add "secure_failures/${enc_file}" >/dev/null 2>&1 || true
          git commit -m "伊蕾娜应急备份：加密失败包 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} [skip ci]" >/dev/null 2>&1 || true
          if git push origin main >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted fallback artifact
        if: (steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure') && steps.build_failure_bundle.outputs.enc_file != '' && steps.push_failure_bundle.outputs.pushed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elaina-encrypted-failure-bundle
          retention-days: 1
          if-no-files-found: error
          path: ${{ steps.build_failure_bundle.outputs.enc_file }}

