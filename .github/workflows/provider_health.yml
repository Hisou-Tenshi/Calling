# =============================================================================
#  Provider Health Probe (Calling) —— 每 6 小时探活所有 provider 的通路，结果存 Calling
# =============================================================================
#
#  为什么（2026-09-15 事故的教训）：
#    回复链的每一次调用都可能落在「官方 / 代理 1 三档 / 代理 2 / Fireworks…」里的任意一条
#    通路上。通路坏了以前只能等线上真调用失败才知道，而失败信息可能只剩一句
#    `APIConnectionError: Connection error.`（真实原因藏在 __cause__ 里）。
#    这里改成**定期先探活**：结果写进 Calling 仓库的 data/provider_health.json，
#    运行时由 Tenshi 的 src/provider_health.py 读取 —— 绿则照常调用，红则在最外层 ban
#    （丢掉该通路 / 传空 key，让既有逻辑自己抛「没有可用通路」再往下一档走）。
#
#  两套运行时、两仓各自探活、各自保存（重要）：
#    · Calling 仓库 = Tenshi 回复的 **primary 运行时**：用 Calling 的 secrets、跑 Tenshi
#      的代码。它的探活结果就存在 **Calling 仓库**（data/provider_health.json 与
#      reports/provider_health/），Calling 的 3 个运行时 workflow 通过
#      PROVIDER_HEALTH_PATH=${{ github.workspace }}/calling/data/provider_health.json 读这份。
#    · Tenshi 仓库 = **fallback 运行时**：用 Tenshi 的 secrets，有自己的探活工作流，
#      结果存在 Tenshi 仓库，Tenshi 运行时读它自己那份。
#    两边刻意不共享探活结果：探活必须用各自运行时真正拿到的那套密钥，否则会出现
#    「用 Calling 的变量探、却按 Tenshi 的结论 ban」的错配（2026-10 修正的就是这个）。
#
#  为什么探活跑在 Calling、脚本却来自 Tenshi 检出：
#    · 完整的一套 provider secrets 在**本仓库**（Tenshi 仓库只有一部分，例如代理1 的
#      三档 key 只在这里），探活必须用运行时真正拿到的那套密钥，否则会漏探、误报；
#    · 探测脚本与 dashboard 脚本属于 Tenshi（**代码共享**），所以 checkout Tenshi 到
#      tenshi/ 只读运行；**结果一律写 Calling 仓库根目录**，绝不回写 tenshi/ 检出
#      （回写 Tenshi = 两套运行时的结论互相污染，也会弄脏检出影响 rebase/autostash）。
#    · 回写走本仓库的 scripts/tenshi_git_sync.py（与 Tenshi 同版本），写法与
#      claude_proxy_reachability.yml 一致（perceive 档：5 次重试 + 无损合并）。
#
#  为什么跑在容器里：
#    回复任务跑在 ghcr.io/hisou-tenshi/calling-tenshi:latest 里，容器的 DNS / 出网 /
#    证书信任链与宿主 runner 不同 —— 只在宿主上探会得出「一切正常」而容器里可能全灭。
#
#  覆盖（按「类别 + 通路」，不按模型名）：
#    claude 代理1 Base/Prime/Max · 代理2 · 官方 ｜ gemini 官方 · 代理 ｜
#    deepseek 官方 · Fireworks 代理 ｜ gpt 官方 ｜ magmarouter 官方 ｜ openrouter 官方 ｜ grok 官方 · 代理
#    通路清单直接来自 Tenshi 自己的 path builder（llm_routing），与运行时一一对应。
#
#  **不真实调用模型**（2026-10 调整）：
#    探活不再发送任何会产出 token 的生成请求（不创建消息、不调 chat 补全 / generateContent），
#    所以没有生成费用、也不吃生成额度。模型维度改用官方「非生成」端点判断：
#      · GET /models 鉴权 + 模型列表成员校验（免费）；
#      · Anthropic /v1/messages/count_tokens、Gemini :countTokens（官方 token 计数，不产出 token）；
#      · 端点没实现 / 拿不到结论 → 该层按「没结论」处理（fail-open，不 ban）。
#    既然没有真实调用，也就不再有「沿用上一次 full 结论」这回事。
#
#  频率：每 6 小时（北京时间 02/08/14/20）跑一次；也可手动 dispatch。
#
#  产出（都提交回 **Calling** 仓库）：
#    · data/provider_health.json             —— 机读结果（本仓运行时 gate 读它；含三层检查留痕）
#    · reports/provider_health/latest.md     —— 人读报告（同时也进 Step Summary / artifact）
#    · reports/provider_health/history.jsonl —— 每次一行历史（dashboard 趋势用）
#    · reports/provider_health/dashboard.html / dashboard.md —— 趋势看板
#
#  失败语义：探活脚本自身异常才让 run 变红；某条通路是红**不算**失败（那是被探出来的
#  事实，运行时自己会 ban 掉）；dashboard 生成失败只告警、不影响探活结论。探活 gate
#  只是旁路：data/provider_health.json 缺失时 provider_health.py fail-open（全部通路照常调用）。
#
#  时区：cron 只认 UTC。北京时间 02:00 = 前一日 18:00 UTC。
# =============================================================================

name: Provider Health Probe (Calling)

on:
  schedule:
    # 每 6 小时（北京时间 02:00 / 08:00 / 14:00 / 20:00）：
    # DNS → TCP → TLS → GET /models（鉴权）→ 模型列表 / count tokens 校验，
    # 全程不调用生成式端点，不产生生成计费、不吃生成额度。
    - cron: "0 18,0,6,12 * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "要探测的类别（逗号分隔）"
        required: false
        default: "claude,gemini,deepseek,gpt,glm,magmarouter,openrouter,grok"
      commit_result:
        description: "把结果提交回 Calling 仓库"
        type: boolean
        default: true

concurrency:
  group: provider-health
  cancel-in-progress: false

# 回写本仓库需要 contents: write（用 REACHABILITY_TOKEN 时以该 PAT 权限为准）；
# 拉取 job 容器镜像需要 packages: read。
permissions:
  contents: write
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/hisou-tenshi/calling-tenshi:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 先 checkout 本仓（Calling）到工作区根：探活结果就写在这里，并由这里回写。
      - name: Checkout Calling (结果写这里)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.REACHABILITY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 同步到 main 最新：workflow_dispatch 的 event SHA 可能落后；探活结果要写回 main，
      # 不先对齐会在 push 时与上一次运行刚提交的结果冲突（探活产物是快照，合并会造混合数据）。
      - name: Sync Calling checkout to latest main
        if: github.ref_name == 'main'
        run: |
          set -uo pipefail
          # job 跑在容器里，checkout 出来的仓库 owner 与容器内用户不一致，git 会拒绝操作。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git reset --hard origin/main

      # 再 checkout Tenshi 到 tenshi/：只为了跑 scripts/ 下的探活与 dashboard 脚本。
      # 注意：这里只读 Tenshi 代码，任何结果都不要写进 tenshi/（否则会污染 Tenshi 检出）。
      - name: Checkout Tenshi (脚本来源，只读)
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.GH_REPO }}
          token: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
          fetch-depth: 0
          path: tenshi

      - name: Probe every provider path
        id: probe
        env:
          PYTHONUNBUFFERED: "1"
          # --- 统一代理/通路配置（每个代理 URL 与 key 独立可设；secret 未配置时回落到代码默认）---
          PROBE_PROVIDERS: ${{ github.event.inputs.providers || 'claude,gemini,deepseek,gpt,glm,magmarouter,openrouter,grok' }}
          # Claude
          CLAUDE_OFFICIAL_BASE_URL: ${{ secrets.CLAUDE_OFFICIAL_BASE_URL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # Claude 代理 1
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          # Claude 代理 2
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          # Gemini
          GEMINI_OFFICIAL_BASE_URL: ${{ secrets.GEMINI_OFFICIAL_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gemini 代理 1
          GEMINI_PROXY_BASE_URL: ${{ secrets.GEMINI_PROXY_BASE_URL }}
          GEMINI_PROXY_KEY: ${{ secrets.GEMINI_PROXY_KEY }}
          # Gemini 代理 2
          GEMINI_PROXY2_BASE_URL: ${{ secrets.GEMINI_PROXY2_BASE_URL }}
          GEMINI_PROXY2_KEY: ${{ secrets.GEMINI_PROXY2_KEY }}
          # Grok
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Grok 代理 1
          GROK_PROXY_BASE_URL: ${{ secrets.GROK_PROXY_BASE_URL }}
          GROK_PROXY_KEY: ${{ secrets.GROK_PROXY_KEY }}
          # GPT
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_REASONING_EFFORT: ${{ secrets.GPT_REASONING_EFFORT }}
          GPT_TOOL_REASONING_EFFORT: ${{ secrets.GPT_TOOL_REASONING_EFFORT }}
          # GPT 代理 1
          GPT_PROXY_BASE_URL: ${{ secrets.GPT_PROXY_BASE_URL }}
          GPT_PROXY_KEY: ${{ secrets.GPT_PROXY_KEY }}
          # DeepSeek
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DeepSeek 代理 1
          FIREWORKS_BASE_URL: ${{ secrets.FIREWORKS_BASE_URL }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_DEEPSEEK_V4_PRO_MODEL: ${{ secrets.FIREWORKS_DEEPSEEK_V4_PRO_MODEL }}
          FIREWORKS_DEEPSEEK_V4_FLASH_MODEL: ${{ secrets.FIREWORKS_DEEPSEEK_V4_FLASH_MODEL }}
          # GLM
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_REASONING_EFFORT: ${{ secrets.GLM_REASONING_EFFORT }}
          GLM_REASONING_EFFORT_AGENT: ${{ secrets.GLM_REASONING_EFFORT_AGENT }}
          # MagmaRouter
          MAGMAROUTER_BASE_URL: ${{ secrets.MAGMAROUTER_BASE_URL }}
          MAGMAROUTER_API_KEY: ${{ secrets.MAGMAROUTER_API_KEY }}
          # OpenRouter
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FALLBACK_MAP: ${{ secrets.OPENROUTER_FALLBACK_MAP }}
          # Qwen embedding（取代 Gemini embedding）
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # embedding
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_DIM: ${{ secrets.EMBEDDING_DIM }}
          EMBEDDING_MAX_INPUT_CHARS: ${{ secrets.EMBEDDING_MAX_INPUT_CHARS }}
          # CoderPlan
          CODERPLAN_PROXY_BASE_URL: ${{ secrets.CODERPLAN_PROXY_BASE_URL }}
          #探活
          PROVIDER_HEALTH_ENABLED: ${{ secrets.PROVIDER_HEALTH_ENABLED }}
          PROVIDER_HEALTH_MAX_AGE_HOURS: ${{ secrets.PROVIDER_HEALTH_MAX_AGE_HOURS }}
          PROVIDER_HEALTH_PATH: ${{ secrets.PROVIDER_HEALTH_PATH }}
        run: |
          set -uo pipefail
          # 探活全程只走官方非生成端点（列模型 / count tokens），不真实调用模型：
          # 没有生成费用，也不吃生成额度。
          # 脚本来自 Tenshi 检出，但 --json/--report/--history 全部落在本仓（Calling）。
          mkdir -p reports/provider_health
          python -u tenshi/scripts/probe_provider_paths.py \
            --providers "$PROBE_PROVIDERS" \
            --deployment calling \
            --deployment-label "Calling primary 运行时（Calling secrets）" \
            --json data/provider_health.json \
            --report reports/provider_health/latest.md \
            --history reports/provider_health/history.jsonl

      # 趋势看板（脚本同样来自 Tenshi 检出；输入输出都在 Calling 仓库）。
      # 看板是派生产物：生成失败只告警、不让 run 变红 —— 探活结论以 JSON / latest.md 为准。
      - name: Build provider health dashboard
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          python -u tenshi/scripts/build_provider_health_dashboard.py \
            --json data/provider_health.json \
            --history reports/provider_health/history.jsonl \
            --out-html reports/provider_health/dashboard.html \
            --out-md reports/provider_health/dashboard.md

      # /dashboard/tenshi 需要 Tenshi 的看板 HTML：Tenshi 检出是按默认分支最新 checkout 的，
      # 这里把它复制进 Calling 的 reports/ 一起提交；Vercel 部署后 /dashboard/tenshi 直接渲染。
      # （GitHub 上点 .html 只会显示源码，所以看板统一挂到 Vercel。）
      - name: Stage Tenshi dashboard for /dashboard/tenshi
        if: always()
        run: |
          set -uo pipefail
          mkdir -p reports/provider_health
          SRC="tenshi/reports/provider_health/dashboard.html"
          if [ -f "$SRC" ]; then
            cp "$SRC" reports/provider_health/tenshi-dashboard.html
            echo "已复制 Tenshi 看板（Tenshi main 最新一次探活产物）"
          else
            echo "::warning::Tenshi 看板尚不存在（Tenshi 探活还没产出 dashboard.html），本次跳过 /dashboard/tenshi"
          fi

      - name: Publish report to Step Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "> 🌐 浏览器看板（Vercel）：`/dashboard`（Calling / Tenshi 两份切换）"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/provider_health/latest.md ]; then
            cat reports/provider_health/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ❌ 探活报告未生成，请查看上一步日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/provider_health/dashboard.md ]; then
            {
              echo ""
              echo "---"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            cat reports/provider_health/dashboard.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ 趋势看板未生成（见 dashboard 步骤日志；不影响探活结论）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-${{ github.run_id }}
          path: |
            data/provider_health.json
            reports/provider_health/
          if-no-files-found: warn
          retention-days: 90

      # 回写 **Calling** 仓库（不是 Tenshi）：这是 Calling primary 运行时自己的探活结果。
      - name: Commit result to Calling
        if: always() && (github.event_name == 'schedule' || github.event.inputs.commit_result != 'false')
        run: |
          set -uo pipefail
          if [ ! -d .git ]; then
            echo "::warning::Calling 检出里没有 .git（checkout 未生效？），跳过回写；结果仍在 artifact 里"
            exit 0
          fi

          SUMMARY="$(python - <<'PY'
          import json, pathlib
          try:
              data = json.loads(pathlib.Path("data/provider_health.json").read_text(encoding="utf-8"))
              parts = []
              for provider, entry in (data.get("providers") or {}).items():
                  paths = entry.get("paths") or {}
                  good = sum(1 for p in paths.values() if p.get("ok"))
                  parts.append(f"{provider}:{'绿' if entry.get('enabled') else '红'}{good}/{len(paths)}")
              method = data.get("probe_method") or "non_call"
              print(f"[{method}] " + (" ".join(parts) or "无结果"))
          except Exception:
              print("结果不可读")
          PY
          )"

          # 探活结果属于可重建的辅助数据，但它是下一轮回复的 gate 输入，所以还是
          # 走 perceive 档（5 次重试 + 无损合并），不用旧的 3 次 push/pull 模板。
          mkdir -p data reports/provider_health
          python -u scripts/tenshi_git_sync.py \
            --repo . \
            --git-name "緋想天子" \
            --git-email "97383295+Hisou-Tenshi@users.noreply.github.com" \
            push \
            --tier perceive \
            --message "Calling 探活：$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 北京时间（${SUMMARY}） [skip ci]" \
            --files data/provider_health.json reports/provider_health
