name: Telegram Webhook (Calling)

on:
  repository_dispatch:
    types: [tg_webhook]
  workflow_dispatch:

concurrency:
  group: tenshi-bot-reply
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  handle_message:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hisou-tenshi/calling-tenshi:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Tenshi repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.GH_REPO }}
          token: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
          fetch-depth: 1
          path: tenshi
          # Reply path only: skip data/archive, secure_failures, logs/archive, etc.
          #
          # 注意：sparse-checkout 的白名单必须覆盖本 workflow 后面 `git add` 的每一个路径。
          # git 对「白名单之外」的路径会直接拒绝 add：
          #   "matched paths that exist outside of your sparse-checkout definition,
          #    so will not be updated in the index"
          # 而 `git add ... || true` 会把这条拒绝吞掉，导致「看不见的静默丢失」——
          # 2026-09-10 排查发现 logs/debug.log 与 logs/llm_trace.jsonl 正因为只写了
          # logs/.gitkeep 而从未入库，log_cleanup 每天归档到的都是空文件。
          # 同批缺失的还有 data/image_analysis_cache.json 与 downloads/。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            scripts/
            .gitattributes
            Tenshi.json
            data/tenshi_log.json
            data/context_compressions.json
            data/summary_cursor.json
            data/knowledge_base.json
            data/perception_schedule.json
            # 感知层「上次沉默时刻」状态：回复链路也会读它做冷却判断
            data/perception_state.json
            # 每日探活结果：runtime 的 provider_health gate 读它决定哪些通路照常调用 / ban 掉
            data/provider_health.json
            data/image_analysis_cache.json
            data/embedding_cache.pkl
            data/tenshi_memory.db
            data/world_history.json
            data/knowledge_base_events/
            downloads/
            logs/debug.log
            logs/llm_trace.jsonl
            logs/.gitkeep
            # 加密失败包必须能入库：2026-09-18 排查发现 `git add secure_failures/...`
            # 因为不在白名单里被 git 拒绝、又被 `|| true` 吞掉，导致「已推送」是假的
            # （secure_failures/ 里最后一个包停在 2026-05-19）。这里补上白名单，
            # 并且 push 时统一走 `git add --sparse`。
            secure_failures/

      - name: "Guard: wait if perception is running"
        env:
          CALLING_REPO: ${{ github.repository }}
          TENSHI_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN_CALLING: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_TENSHI: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, datetime

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          calling_repo = os.environ.get("CALLING_REPO", "")
          tenshi_repo = os.environ.get("TENSHI_REPO", "")
          token_calling = os.environ.get("GH_TOKEN_CALLING", "")
          token_tenshi = os.environ.get("GH_TOKEN_TENSHI", "")
          branch = os.environ.get("GITHUB_REF_NAME") or "main"

          perception_workflow_path = ".github/workflows/perception_trigger.yml"

          def _parse_iso8601(ts: str):
            if not ts:
              return None
            try:
              # GitHub timestamps are usually like: 2026-07-02T03:15:42Z
              return datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
            except Exception:
              return None

          def has_perception_run(repo_full: str, token: str) -> bool:
            if not repo_full or not token:
              return False
            owner, name = repo_full.split("/", 1)
            headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"token {token}",
            }
            try:
              # Only "in_progress" can truly conflict with current webhook execution.
              # "queued" is frequently noisy (cross-workflow backlogs) and can cause false blocking.
              url = (
                f"https://api.github.com/repos/{owner}/{name}"
                f"/actions/runs?per_page=100&branch={branch}&status=in_progress"
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                data = json.load(resp)
              now_utc = datetime.datetime.now(datetime.timezone.utc)
              for r in data.get("workflow_runs", []) or []:
                rid = r.get("id")
                if run_id and str(rid) == str(run_id):
                  continue
                path = (r.get("path") or "")
                event = (r.get("event") or "")
                if not (path == perception_workflow_path or path.endswith("/perception_trigger.yml")):
                  continue
                # Extra guard: only treat actual perception dispatch/manual runs as blockers.
                if event not in ("repository_dispatch", "workflow_dispatch"):
                  continue
                # Ignore stale "in_progress" records that were not updated recently.
                updated_at = _parse_iso8601(r.get("updated_at") or "")
                if updated_at is None:
                  return True
                if (now_utc - updated_at).total_seconds() <= 180:
                  return True
              return False
            except Exception:
              return False

          deadline_s = time.time() + 300
          while time.time() < deadline_s:
            if (
              has_perception_run(calling_repo, token_calling)
              or has_perception_run(tenshi_repo, token_tenshi)
            ):
              time.sleep(10)
              continue
            break
          PY

      - name: Process Message (run Tenshi/src)
        id: process_message
        continue-on-error: true
        working-directory: tenshi
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
          REPO_NAME: ${{ secrets.GH_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_BASE_URL: ${{ secrets.FIREWORKS_BASE_URL }}
          FIREWORKS_DEEPSEEK_V4_PRO_MODEL: ${{ secrets.FIREWORKS_DEEPSEEK_V4_PRO_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL }}
          # GLM（智谱 / Z.ai，走官方 zai-sdk）：主对话 high 档 + low 档随机池的一家
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          MASTER_KEY_SOURCE: ${{ secrets.MASTER_KEY_SOURCE }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
          MSG_TEXT: ${{ github.event.client_payload.text }}
          MSG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MSG_USER_ID: ${{ github.event.client_payload.user_id }}
          MSG_ID: ${{ github.event.client_payload.msg_id }}
          MSG_FILE_ID: ${{ github.event.client_payload.file_id }}
          MSG_FILE_TYPE: ${{ github.event.client_payload.file_type }}
          MSG_FILE_NAME: ${{ github.event.client_payload.file_name }}
          MSG_FILE_IDS: ${{ toJSON(github.event.client_payload.file_ids) }}
          MSG_LOCATION: ${{ toJSON(github.event.client_payload.location) }}
          MSG_DATE: ${{ github.event.client_payload.date }}
          IS_RANDOM_TRIGGER: ${{ github.event.client_payload.is_random_trigger }}
          CURRENT_WEATHER: ${{ github.event.client_payload.weather }}
          TIMEZONE_OFFSET: ${{ secrets.TIMEZONE_OFFSET }}
          PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
          PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u src/telegram_tenshi_logger.py --debug --force_reply
          else
            python -u src/telegram_tenshi_logger.py
          fi
          code=$?
          if [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Commit and Push Changes (to Tenshi repo)
        if: always()
        id: commit_push
        working-directory: tenshi
        run: |
          # 用户回复是最高优先级：这一份改动**必须**落到 Tenshi main。
          # 统一走 scripts/tenshi_git_sync.py（reply 档：7 次重试 + 指数退避 +
          # 无损冲突合并）。它替代了原先那段「push → fetch → rebase →
          # checkout --ours → 重试」的模板——那段模板会在撞车时把本次回复
          # 整体换成远端版本、把 rebase 卡在 .git/rebase-merge 里，然后
          # 全程 >/dev/null 静默失败（2026-09-18 #3221 就是这么挂的）。
          python -u scripts/tenshi_git_sync.py \
            --repo . \
            --git-name "比那名居 天子" \
            --git-email "268836736+ZenjinruiNoHisouten@users.noreply.github.com" \
            push \
            --tier reply \
            --message "天子已阅：对话与痕迹入档 [skip ci]" \
            --files \
              Tenshi.json \
              data/tenshi_log.json \
              data/context_compressions.json \
              data/perception_schedule.json \
              data/perception_state.json \
              data/image_analysis_cache.json \
              data/knowledge_base.json \
              downloads/ \
              logs/debug.log \
              logs/llm_trace.jsonl \
              logs/.gitkeep

      # 落库自检：回复链路的要求是「无论如何都要落到 main」。
      #
      # 注意两件事（2026-09-18 两个真实故障）：
      #   1. GitHub 的 `run:` 用的是 POSIX sh（dash），**不支持** `${VAR:0:8}`
      #      这种 bash 子串展开 —— 那样会 "Bad substitution" 且 `set -e` 下直接退出。
      #      所以这里用 `cut -c1-8`。
      #   2. 自检本身绝不能成为误报来源：只有 GitHub 明确回答「没有这个 commit」
      #      （404/422）才算失败；令牌没权限、网络抖动、gh 缺失等一律只告警。
      #      真正的落库保证在 scripts/tenshi_git_sync.py 里（push 成功后本地核对
      #      origin/main 是否已包含本次提交），那一步不依赖 gh。
      - name: Verify commit landed on Tenshi main
        id: verify_landed
        if: always()
        working-directory: tenshi
        env:
          GH_TOKEN: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
          TENSHI_REPO: ${{ secrets.GH_REPO }}
          COMMITTED_SHA: ${{ steps.commit_push.outputs.committed_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "${COMMITTED_SHA}" ]; then
            echo "本次没有产生新提交（无变更），跳过落库自检"
            exit 0
          fi
          if [ -z "${TENSHI_REPO}" ]; then
            echo "::warning::GH_REPO 未配置，跳过落库自检"
            exit 0
          fi
          SHORT=$(printf '%s' "${COMMITTED_SHA}" | cut -c1-8)
          echo "自检：${SHORT} 是否已在 ${TENSHI_REPO}@${BRANCH}"
          set +e
          detail=$(gh api "repos/${TENSHI_REPO}/commits/${COMMITTED_SHA}" 2>&1)
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "落库自检通过：${SHORT} 已在远端"
            exit 0
          fi
          case "$detail" in
            *"HTTP 404"*|*"HTTP 422"*)
              echo "::error::落库自检失败：${SHORT} 不在 ${TENSHI_REPO}@${BRANCH} 上，本次回复没有进 main"
              exit 1
              ;;
          esac
          echo "::warning::落库自检无法完成（gh api 退出码 ${rc}）；落库结论以 tenshi_git_sync 的本地核对为准"
          exit 0

      # 最后的兜底：只要「回复脚本失败」或「没能落库」，就把本轮全部状态（含 base64
      # 编码的二进制/大文件）和一份完整 git bundle 传成 artifact。这是「就算失败也
      # 一定要完整保存」的实现。artifact 相比加密包是明文，所以保留 7 天后自动过期。
      - name: Backup full state to Artifacts (never lose a reply)
        id: fallback_artifact
        if: always() && (steps.process_message.outcome == 'failure' || steps.commit_push.outcome == 'failure' || steps.verify_landed.outcome == 'failure')
        working-directory: tenshi
        env:
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          PROCESS_MESSAGE_OUTCOME: ${{ steps.process_message.outcome }}
          COMMIT_PUSH_OUTCOME: ${{ steps.commit_push.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_landed.outcome }}
        run: |
          set +e
          set +o pipefail 2>/dev/null || true
          staging="${RUNNER_TEMP:-/tmp}/tenshi-fallback-${RUN_ID}"
          mkdir -p "$staging/b64"
          if git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
            unpushed="$(git log --oneline "origin/${BRANCH}..HEAD" 2>&1)"
          else
            unpushed="(origin/${BRANCH} 不存在，无法比对)"
          fi
          {
            echo "run_id=${RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=$(git rev-parse HEAD 2>/dev/null)"
            echo "branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)"
            echo "process_message=${PROCESS_MESSAGE_OUTCOME}"
            echo "commit_push=${COMMIT_PUSH_OUTCOME}"
            echo "verify_landed=${VERIFY_OUTCOME}"
            echo
            echo "--- git status --porcelain=v1 -b ---"
            git status --porcelain=v1 -b 2>&1
            echo
            echo "--- git log -3 ---"
            git log --oneline -3 2>&1
            echo
            echo "--- 未推送的提交（相对 origin/${BRANCH}） ---"
            echo "$unpushed"
          } > "$staging/_MANIFEST.txt" 2>&1

          files="data/tenshi_log.json data/context_compressions.json data/knowledge_base.json \
            data/perception_schedule.json data/perception_state.json data/provider_health.json \
            data/image_analysis_cache.json data/summary_cursor.json data/world_history.json \
            logs/debug.log logs/llm_trace.jsonl"
          for f in $files; do
            [ -f "$f" ] || continue
            mkdir -p "$staging/$(dirname "$f")"
            if grep -qIl . "$f" 2>/dev/null; then
              cp "$f" "$staging/$f"
            else
              # 二进制/非文本：base64 编码后再存，保证内容一个字节都不丢
              base64 "$f" > "$staging/b64/$(echo "$f" | tr '/' '_').b64"
            fi
          done
          # 完整的 git 状态（含未推送的提交）
          git bundle create "$staging/tenshi-repo-${RUN_ID}.bundle" HEAD 2>&1 | tail -n 2
          echo "备份目录内容：" && find "$staging" -type f | sort

      - name: Upload full-state Artifact
        # 条件与备份步骤保持一致即可：能走到这里就说明确实需要兜底。
        # 之前这里用 `steps.fallback_artifact.outcome == 'success'` 判断，
        # 实测会误判成 skipped（备份步骤明明跑出了 13 个文件），artifact 反而不上传。
        if: always() && (steps.process_message.outcome == 'failure' || steps.commit_push.outcome == 'failure' || steps.verify_landed.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: tenshi-full-state-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/tenshi-fallback-${{ github.run_id }}

      - name: Build encrypted failure bundle
        if: steps.process_message.outcome == 'failure' || failure()
        id: build_failure_bundle
        working-directory: tenshi
        env:
          MASTER_KEY_SOURCE: ${{ secrets.MASTER_KEY_SOURCE }}
        run: |
          set -e
          bundle_name="tenshi_failure_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.tar.gz"
          enc_name="${bundle_name}.enc"
          if [ -z "$MASTER_KEY_SOURCE" ]; then
            echo "::warning::MASTER_KEY_SOURCE 未配置，跳过加密失败包（完整状态仍在 full-state artifact 里）"
            exit 0
          fi
          tar -czf "/tmp/${bundle_name}" \
            data/tenshi_log.json \
            data/context_compressions.json \
            data/knowledge_base.json \
            data/perception_state.json \
            logs/debug.log \
            logs/llm_trace.jsonl 2>/dev/null || true
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "/tmp/${bundle_name}" \
            -out "${GITHUB_WORKSPACE}/${enc_name}" \
            -pass pass:"${MASTER_KEY_SOURCE}" >/dev/null 2>&1
          rm -f "/tmp/${bundle_name}"
          echo "enc_file=${enc_name}" >> "$GITHUB_OUTPUT"

      - name: Push encrypted failure bundle to Tenshi
        if: steps.build_failure_bundle.outputs.enc_file != ''
        id: push_failure_bundle
        working-directory: tenshi
        run: |
          # 关键修复：走 tenshi_git_sync（`git add --sparse` + 真实重试），
          # 原来的 `git add secure_failures/...` 会被 sparse-checkout 直接拒绝，
          # 再被 `|| true` 吞掉 → commit 里没有这个文件，却报告 pushed=true。
          set +e
          enc_file="${{ steps.build_failure_bundle.outputs.enc_file }}"
          mkdir -p secure_failures
          cp "${GITHUB_WORKSPACE}/${enc_file}" "secure_failures/${enc_file}"
          if python -u scripts/tenshi_git_sync.py \
              --git-name "比那名居 天子" \
              --git-email "268836736+ZenjinruiNoHisouten@users.noreply.github.com" \
              --repo . \
              push \
              --tier reply \
              --message "天子应急备份：加密失败包 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} [skip ci]" \
              --files "secure_failures/${enc_file}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::加密失败包没能推回 Tenshi；完整状态已在 full-state artifact 里"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted fallback artifact
        if: steps.build_failure_bundle.outputs.enc_file != '' && steps.push_failure_bundle.outputs.pushed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tenshi-encrypted-failure-bundle
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.build_failure_bundle.outputs.enc_file }}

