name: Perception Layer Trigger (Calling)

on:
  repository_dispatch:
    types: [perception_trigger]
  workflow_dispatch:

# 与 webhook 共享回复并发组
concurrency:
  group: tenshi-bot-reply
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  perception:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hisou-tenshi/calling-tenshi:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Tenshi repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.GH_REPO }}
          token: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
          fetch-depth: 1
          path: tenshi
          # Perception path only: skip data/archive, secure_failures, logs/archive, etc.
          #
          # 注意：sparse-checkout 白名单必须覆盖本 workflow 后面 `git add` 的每个路径，
          # 否则 git 会拒绝 add（"matched paths that exist outside of your
          # sparse-checkout definition"）而 `|| true` 会把拒绝吞掉。
          # 2026-09-10 排查发现 logs/debug.log 与 logs/llm_trace.jsonl 因为只写了
          # logs/.gitkeep 而从未入库，导致 log_cleanup 归档的全是空文件。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            scripts/
            .gitattributes
            Tenshi.json
            data/tenshi_log.json
            data/context_compressions.json
            data/summary_cursor.json
            data/knowledge_base.json
            data/perception_schedule.json
            # 感知层「上次沉默时刻」状态：纯沉默不再写 tenshi_log.json，冷却/触发间隔
            # 改读这个文件；不放进白名单就会导致 git add 被拒 → 状态永远推不回去。
            data/perception_state.json
            # 每日探活结果：感知层里也可能补跑回复引擎，同样要能读到 provider health
            data/provider_health.json
            data/image_analysis_cache.json
            data/embedding_cache.pkl
            data/tenshi_memory.db
            data/world_history.json
            data/knowledge_base_events/
            downloads/
            logs/debug.log
            logs/llm_trace.jsonl
            logs/.gitkeep
            # 加密失败包要能入库：`git add secure_failures/...` 曾在白名单外被
            # sparse-checkout 拒绝并被 || true 吞掉（2026-09-18 排查确认）。
            secure_failures/

      - name: "Guard: skip perception if webhook running"
        id: guard_webhook
        env:
          CALLING_REPO: ${{ github.repository }}
          TENSHI_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN_CALLING: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_TENSHI: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          out_path = os.environ.get("GITHUB_OUTPUT", "")
          calling_repo = os.environ.get("CALLING_REPO", "")
          tenshi_repo = os.environ.get("TENSHI_REPO", "")
          token_calling = os.environ.get("GH_TOKEN_CALLING", "")
          token_tenshi = os.environ.get("GH_TOKEN_TENSHI", "")

          # 保底：守卫条件拿不到时，倾向跳过（避免 webhook + perception 重复生成回复）
          if not out_path or (not token_calling and not token_tenshi):
            with open(out_path, "a", encoding="utf-8") as f:
              f.write("should_skip=false\n")
            sys.exit(0)

          telegram_workflow_path = ".github/workflows/telegram_webhook.yml"
          branch = os.environ.get("GITHUB_REF_NAME") or "main"

          def has_telegram_run(repo_full: str, token: str, status: str) -> bool:
            try:
              if not repo_full or not token:
                return False

              owner, name = repo_full.split("/", 1)
              url = (
                f"https://api.github.com/repos/{owner}/{name}"
                f"/actions/runs?per_page=100&branch={branch}&status={status}"
              )
              headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": f"token {token}",
              }
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                data = json.load(resp)
              for r in data.get("workflow_runs", []) or []:
                rid = r.get("id")
                if run_id and str(rid) == str(run_id):
                  continue
                path = (r.get("path") or "")
                if path == telegram_workflow_path or path.endswith("/telegram_webhook.yml"):
                  return True
              return False
            except Exception:
              # 守卫失败时，为了避免重复生成回复，倾向跳过
              return True

          should_skip = False
          for st in ("in_progress", "queued"):
            if has_telegram_run(calling_repo, token_calling, st) or has_telegram_run(tenshi_repo, token_tenshi, st):
              should_skip = True
              break

          with open(out_path, "a", encoding="utf-8") as f:
            f.write(f"should_skip={'true' if should_skip else 'false'}\n")
          PY

      - name: Restore schedule KV if this run was skipped
        # 守卫跳过时，Cloudflare Worker 已经把队首从 KV 弹掉了。这里把 tenshi 仓库里那份
        # data/perception_schedule.json 的待触发队列重新同步回 KV，让下一次 cron 还能捞起来；
        # 否则这条定时（包括主回复全链失败后登记的 [reply-retry] 近程重试）就此丢失。
        if: steps.guard_webhook.outputs.should_skip == 'true'
        working-directory: tenshi
        env:
          PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
          PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          try:
              # 优先用公开 helper；老版本仓库（如 Elaina 的副本）没有它时退回内部 loader
              try:
                  from perception_schedule import list_pending_schedule_entries as _list_entries
              except ImportError:
                  from perception_schedule import _load_doc

                  def _list_entries():
                      return (_load_doc().get("entries") or [])
              from perception_schedule import _sync_to_worker_kv

              entries = _list_entries()
              print(f"[schedule-restore] 本次被守卫跳过，重新同步 {len(entries)} 条待触发条目到 KV")
              print(_sync_to_worker_kv(entries))
          except Exception as e:
              print(f"[schedule-restore] 跳过（best-effort）：{type(e).__name__}: {e}")
          PY

      - name: Run Perception Layer
        id: run_perception
        continue-on-error: true
        if: steps.guard_webhook.outputs.should_skip != 'true'
        working-directory: tenshi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Qwen embedding（取代 Gemini embedding）
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GEMINI_PROXY_BASE_URL: ${{ secrets.GEMINI_PROXY_BASE_URL }}
          GEMINI_PROXY_KEY: ${{ secrets.GEMINI_PROXY_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_BASE_URL: ${{ secrets.FIREWORKS_BASE_URL }}
          FIREWORKS_DEEPSEEK_V4_PRO_MODEL: ${{ secrets.FIREWORKS_DEEPSEEK_V4_PRO_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          # 感知层里会补跑回复引擎（[reply-retry] 重试），回复链的 OpenRouter/Grok 段也要能起来
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          MAGMAROUTER_API_KEY: ${{ secrets.MAGMAROUTER_API_KEY }}
          MAGMAROUTER_BASE_URL: ${{ secrets.MAGMAROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL }}
          # GLM（智谱 / Z.ai，走官方 zai-sdk）：主对话 high 档 + low 档随机池的一家
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
          # 时间口径统一为北京时间（UTC+8）：固定传 8，不再依赖 TIMEZONE_OFFSET secret。
          TIMEZONE_OFFSET: "8"
          PERCEPTION_SCHEDULED_FORCE: ${{ github.event.client_payload.scheduled_force }}
          PERCEPTION_SCHEDULE_NOTE: ${{ github.event.client_payload.note }}
          PERCEPTION_TRIGGER_AT_MS: ${{ github.event.client_payload.trigger_at_ms }}
          # 感知层里也可能补跑回复引擎（[reply-retry] 近程重试），它登记的定时条目要能同步 KV
          PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
          PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
        run: |
          set +e
          git config --global --add safe.directory /__w/Calling/Calling/tenshi
          ARGS=""
          if [ "${{ github.event.client_payload.scheduled_force }}" = "true" ]; then
            echo "Scheduled force trigger (Cloudflare KV)."
            ARGS="--scheduled-force"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--force"
          fi
          python -u src/perception_layer.py $ARGS
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "Perception skipped (probability/cooldown); no commit needed."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit and Push Changes (to Tenshi repo)
        if: steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'success' && steps.run_perception.outputs.exit_code != '2'
        working-directory: tenshi
        run: |
          # 感知层：perceive 档（5 次重试 + 无损合并）。原来是同一段有 bug 的
          # push/rebase/checkout --ours 模板，撞车时会静默丢内容并卡住 rebase。
          python -u scripts/tenshi_git_sync.py \
            --repo . \
            --git-name "比那名居 天子" \
            --git-email "268836736+ZenjinruiNoHisouten@users.noreply.github.com" \
            push \
            --tier perceive \
            --message "天子感知层：世界观测日志 [skip ci]" \
            --files \
              Tenshi.json \
              data/tenshi_log.json \
              data/context_compressions.json \
              data/perception_schedule.json \
              data/perception_state.json \
              data/image_analysis_cache.json \
              data/knowledge_base.json \
              downloads/ \
              logs/debug.log \
              logs/llm_trace.jsonl \
              logs/.gitkeep

      - name: Build encrypted failure bundle
        if: steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure'
        id: build_failure_bundle
        working-directory: tenshi
        env:
          MASTER_KEY_SOURCE: ${{ secrets.MASTER_KEY_SOURCE }}
        run: |
          set -e
          if [ -z "$MASTER_KEY_SOURCE" ]; then
            echo "MASTER_KEY_SOURCE not set; skip encrypted failure bundle."
            exit 0
          fi
          bundle_name="tenshi_failure_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.tar.gz"
          enc_name="${bundle_name}.enc"
          tar -czf "/tmp/${bundle_name}" \
            data/tenshi_log.json \
            data/context_compressions.json \
            data/knowledge_base.json \
            logs/debug.log \
            logs/llm_trace.jsonl 2>/dev/null || true
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "/tmp/${bundle_name}" \
            -out "${GITHUB_WORKSPACE}/${enc_name}" \
            -pass pass:"${MASTER_KEY_SOURCE}" >/dev/null 2>&1
          rm -f "/tmp/${bundle_name}"
          echo "enc_file=${enc_name}" >> "$GITHUB_OUTPUT"

      - name: Push encrypted failure bundle to Tenshi
        if: (steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure') && steps.build_failure_bundle.outputs.enc_file != ''
        id: push_failure_bundle
        working-directory: tenshi
        run: |
          # 走 tenshi_git_sync：`git add --sparse` 才不会被 sparse-checkout 拒绝
          # （原写法会静默丢掉这个包，却报告 pushed=true）。
          set +e
          enc_file="${{ steps.build_failure_bundle.outputs.enc_file }}"
          mkdir -p secure_failures
          cp "${GITHUB_WORKSPACE}/${enc_file}" "secure_failures/${enc_file}"
          if python -u scripts/tenshi_git_sync.py \
              --git-name "比那名居 天子" \
              --git-email "268836736+ZenjinruiNoHisouten@users.noreply.github.com" \
              --repo . \
              push \
              --tier reply \
              --message "天子应急备份：加密失败包 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} [skip ci]" \
              --files "secure_failures/${enc_file}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::加密失败包没能推回 Tenshi"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted fallback artifact
        if: (steps.guard_webhook.outputs.should_skip != 'true' && steps.run_perception.outcome == 'failure') && steps.build_failure_bundle.outputs.enc_file != '' && steps.push_failure_bundle.outputs.pushed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tenshi-encrypted-failure-bundle
          retention-days: 1
          if-no-files-found: error
          path: ${{ steps.build_failure_bundle.outputs.enc_file }}


