# =============================================================================
#  Claude 代理可达性检测（Claude Proxy Reachability）—— 独立诊断工作流
# =============================================================================
#
#  这个 workflow 回答一个线上很难查的问题：**从 GitHub 托管 runner 出发，
#  Claude 的每一档通路到底能不能用？**
#
#  背景：
#    Tenshi / Elaina 的回复链跑在本仓库的 Actions 里，Claude 走「代理1 三档
#    key（Base/Prime/Max）→ 代理2 → 官方」。代理不可用时，线上表现只是
#    「Claude 一路降级」，看不出到底是
#      · GitHub runner 的出网被墙/被限流（本地却完全正常），
#      · 代理证书/域名变了，
#      · key 被禁用、额度耗尽或被 WAF 拦，
#      · 还是单纯上游 5xx。
#    本工作流把这几层拆开分别探测，产出可读报告，任何一步失败都能一眼定位。
#
#  隔离性（重要）：
#    · 只 checkout 本仓库（Hisou-Tenshi/Calling），**不引用、不 checkout、
#      不 dispatch Tenshi 任何东西**，也不使用跨仓库 token；
#    · 探测脚本 `scripts/claude_proxy_reachability.py` 只用 Python 标准库，
#      不 import 任何 Tenshi 代码；
#    · 因为 Calling 代跑 Tenshi 的工作流，两边环境变量名完全一致，所以这里
#      直接复用同一套 secrets（CLAUDE_* / CLAUDE_PROXY_*），不需要新配置。
#
#  每一档探测 5 层：DNS → TCP → TLS（含证书到期）→ HTTP（/v1/models 与
#  /v1/messages，max_tokens=1）→ runner 公网出口 IP（代理方要求加白名单时用它）。
#  `Official`（Anthropic 官方）作为对照组：官方也挂说明是 runner 出网问题，
#  只有代理挂说明是代理侧问题。
#
#  ⚠️ 关键：**同一次运行里探测两个环境，并出一份对照报告**。
#    Tenshi 的回复任务跑在 `container:` 指定的 job 容器里（见 telegram_webhook.yml，
#    镜像 ghcr.io/hisou-tenshi/calling-tenshi:latest），容器与宿主 runner 的 DNS /
#    出网 / 证书信任链**并不相同**。2026-09-15 的实例：宿主 runner 上探测
#    Proxy1 三档 + 官方全部 200，而 Tenshi 在容器里每一轮 pre-flight 都是
#    `APIConnectionError: Connection error.`（已提交日志里 268/268 全失败）——
#    只在宿主上测就会得出「代理一切正常」的错误结论。
#    因此本工作流会先测宿主，再用 `docker run` 进同一个镜像测一遍，最后生成
#    `compare.md` 指出「哪些通路只在容器里不可达」，这就是运行时失败的**说法**。
#
#  产出（都留在本仓库内）：
#    · reports/claude-proxy-reachability/host/…       —— 宿主 runner 侧（latest.md/json/log）
#    · reports/claude-proxy-reachability/container/…  —— Tenshi 运行容器侧（同上）
#    · reports/claude-proxy-reachability/compare.md   —— 两侧对照结论
#    · reports/claude-proxy-reachability/history.jsonl —— 每次一行摘要（保留最近 500 条）
#    · Actions artifact（保留 90 天）+ run 页面的 Step Summary
#  报告由本 workflow 自己提交回本仓库（提交信息带 [skip ci]，避免连锁触发）。
#
#  失败语义：默认「只要有已配置通路不可用就让本次运行失败」（Actions 会给仓库
#  所有者发通知，等于一个免费的告警）——容器侧结论优先，因为那才是 Tenshi 的真实
#  运行环境。可用 workflow_dispatch 的 fail_on_unreachable=false 临时关掉；
#  若一个通路都没配置（secrets 缺失），只发 warning 不算失败。
#
#  手动运行：Actions → Claude Proxy Reachability → Run workflow，
#  可指定候选模型 / 探测次数 / 是否真的发 messages（关掉 = 零 token 消耗）。
# =============================================================================

name: Claude Proxy Reachability

on:
  schedule:
    # 每 6 小时一次（23 分这个非整点分钟避开调度高峰）：01:23 / 07:23 / 13:23 / 19:23 UTC
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "messages 探测的候选模型（逗号分隔，依次尝试）"
        required: false
        default: "claude-opus-4-6,claude-sonnet-4-6,claude-3-5-sonnet-20241022"
      attempts:
        description: "每个通路的 messages 探测次数"
        required: false
        default: "3"
      probe_messages:
        description: "是否真的调用 /v1/messages（false = 只探网络与 /v1/models，零 token 消耗）"
        type: boolean
        default: true
      fail_on_unreachable:
        description: "存在不可用通路时让本次运行失败"
        type: boolean
        default: true
      commit_report:
        description: "把报告提交回本仓库"
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: claude-proxy-reachability
  cancel-in-progress: false

env:
  REPORT_DIR: reports/claude-proxy-reachability
  TENSHI_IMAGE: ghcr.io/hisou-tenshi/calling-tenshi:latest

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (本仓库，不涉及 Tenshi)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REACHABILITY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run reachability probe
        id: probe
        continue-on-error: true
        env:
          # 与 Tenshi 完全同名的一套环境变量（Calling 代跑 Tenshi 工作流）
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_KEY: ${{ secrets.CLAUDE_PROXY_KEY }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          PROBE_MODELS: ${{ github.event.inputs.models || 'claude-opus-4-6,claude-sonnet-4-6,claude-3-5-sonnet-20241022' }}
          PROBE_ATTEMPTS: ${{ github.event.inputs.attempts || '3' }}
          PROBE_MESSAGES: ${{ github.event.inputs.probe_messages || 'true' }}
          FAIL_ON_UNREACHABLE: ${{ github.event.inputs.fail_on_unreachable || 'true' }}
        run: |
          set -uo pipefail
          ARGS=(--models "$PROBE_MODELS" --attempts "$PROBE_ATTEMPTS")
          if [ "$PROBE_MESSAGES" != "true" ]; then
            ARGS+=(--no-messages)
          fi
          if [ "$FAIL_ON_UNREACHABLE" = "true" ]; then
            ARGS+=(--fail-on-unreachable)
          fi

          echo "探测参数：${ARGS[*]}"
          python3 scripts/claude_proxy_reachability.py "${ARGS[@]}" --out-dir "$REPORT_DIR/host" --env-label "宿主 runner"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          # 退出码留到最后一步统一判定：这里先保证报告/日志一定产出
          exit 0

      - name: Probe inside the Tenshi job container (same image as the reply run)
        id: probe_container
        continue-on-error: true
        env:
          # 与上面完全同一套变量；`docker run -e NAME`（不带值）会从当前环境透传
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_KEY: ${{ secrets.CLAUDE_PROXY_KEY }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
          PROBE_MODELS: ${{ github.event.inputs.models || 'claude-opus-4-6,claude-sonnet-4-6,claude-3-5-sonnet-20241022' }}
          PROBE_ATTEMPTS: ${{ github.event.inputs.attempts || '3' }}
          PROBE_MESSAGES: ${{ github.event.inputs.probe_messages || 'true' }}
          FAIL_ON_UNREACHABLE: ${{ github.event.inputs.fail_on_unreachable || 'true' }}
        run: |
          set -uo pipefail
          # Tenshi 的回复任务跑在 container: 里（见 telegram_webhook.yml），
          # 容器的 DNS / 出网 / 证书链和宿主 runner 并不相同——只在宿主上探测会得出
          # 「代理一切正常」，而 Tenshi 在容器里每一轮都连不上。所以这里必须进容器再测一遍。
          if ! echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1; then
            echo "::warning::ghcr 登录失败，跳过容器内探测（对照报告将只有宿主一侧）"
            exit 0
          fi
          if ! docker pull "$TENSHI_IMAGE" >/dev/null 2>&1; then
            echo "::warning::拉取 $TENSHI_IMAGE 失败，跳过容器内探测"
            exit 0
          fi

          ARGS=(--models "$PROBE_MODELS" --attempts "$PROBE_ATTEMPTS")
          if [ "$PROBE_MESSAGES" != "true" ]; then
            ARGS+=(--no-messages)
          fi
          if [ "$FAIL_ON_UNREACHABLE" = "true" ]; then
            ARGS+=(--fail-on-unreachable)
          fi

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work \
            --entrypoint python3 \
            -e CLAUDE_API_KEY -e CLAUDE_PROXY_BASE_URL \
            -e CLAUDE_PROXY_KEY_BASE -e CLAUDE_PROXY_KEY_PRIME -e CLAUDE_PROXY_KEY_MAX -e CLAUDE_PROXY_KEY \
            -e CLAUDE_PROXY_BASE_URL_2 -e CLAUDE_PROXY_KEY_2 \
            "$TENSHI_IMAGE" scripts/claude_proxy_reachability.py "${ARGS[@]}" \
              --out-dir "$REPORT_DIR/container" --env-label "Tenshi 运行容器"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::容器内探测退出码 ${code}（报告已尽力产出；宿主退出码见下一步判定）"
          fi
          exit 0

      - name: Reproduce Tenshi's own Claude client call (same image, same SDK, raw secrets)
        id: reproduce
        continue-on-error: true
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_PROXY_BASE_URL: ${{ secrets.CLAUDE_PROXY_BASE_URL }}
          CLAUDE_PROXY_KEY_BASE: ${{ secrets.CLAUDE_PROXY_KEY_BASE }}
          CLAUDE_PROXY_KEY_PRIME: ${{ secrets.CLAUDE_PROXY_KEY_PRIME }}
          CLAUDE_PROXY_KEY_MAX: ${{ secrets.CLAUDE_PROXY_KEY_MAX }}
          CLAUDE_PROXY_KEY: ${{ secrets.CLAUDE_PROXY_KEY }}
          CLAUDE_PROXY_BASE_URL_2: ${{ secrets.CLAUDE_PROXY_BASE_URL_2 }}
          CLAUDE_PROXY_KEY_2: ${{ secrets.CLAUDE_PROXY_KEY_2 }}
        run: |
          set -uo pipefail
          # 这一步的价值：用**和 Tenshi 一模一样的方式**（同一个镜像、同一个 anthropic SDK、
          # 未做任何 strip 的原始 env 值）真发一次请求，并把 SDK 藏起来的 __cause__ 打出来。
          # Tenshi 运行时只会看到 `APIConnectionError: Connection error.`，
          # 而 __cause__ 会直接说明是 DNS、TLS、代理，还是「本地构造请求就被拒」。
          if ! docker image inspect "$TENSHI_IMAGE" >/dev/null 2>&1; then
            echo "::warning::镜像不在本地（容器探测步骤可能已跳过），跳过复现"
            exit 0
          fi

          docker run --rm -i -u "$(id -u):$(id -g)" \
            --entrypoint python3 \
            -e CLAUDE_API_KEY -e CLAUDE_PROXY_BASE_URL \
            -e CLAUDE_PROXY_KEY_BASE -e CLAUDE_PROXY_KEY_PRIME -e CLAUDE_PROXY_KEY_MAX -e CLAUDE_PROXY_KEY \
            -e CLAUDE_PROXY_BASE_URL_2 -e CLAUDE_PROXY_KEY_2 \
            "$TENSHI_IMAGE" - <<'PY'
          import os
          import anthropic

          KEYS = [
              "CLAUDE_API_KEY",
              "CLAUDE_PROXY_KEY_BASE",
              "CLAUDE_PROXY_KEY_PRIME",
              "CLAUDE_PROXY_KEY_MAX",
              "CLAUDE_PROXY_KEY",
              "CLAUDE_PROXY_KEY_2",
          ]
          SECRETS = [os.getenv(k) or "" for k in KEYS]

          def redact(text: str) -> str:
              out = str(text)
              for s in SECRETS:
                  if s:
                      out = out.replace(s, "<redacted>")
              return out

          def shape(value: str) -> str:
              stripped = value.strip()
              return (
                  f"len={len(value)} 尾随空白={value != value.rstrip()} 前导空白={value != value.lstrip()}"
                  f" 控制字符={sum(1 for c in value if ord(c) < 32)} 非ASCII={sum(1 for c in value if ord(c) > 126)}"
              )

          TARGETS = [
              ("Proxy 1 Base", "CLAUDE_PROXY_BASE_URL", ("CLAUDE_PROXY_KEY_BASE", "CLAUDE_PROXY_KEY")),
              ("Proxy 1 Prime", "CLAUDE_PROXY_BASE_URL", ("CLAUDE_PROXY_KEY_PRIME",)),
              ("Proxy 1 Max", "CLAUDE_PROXY_BASE_URL", ("CLAUDE_PROXY_KEY_MAX",)),
              ("Proxy 2", "CLAUDE_PROXY_BASE_URL_2", ("CLAUDE_PROXY_KEY_2",)),
              ("Official", "", ("CLAUDE_API_KEY",)),
          ]

          print(f"anthropic SDK 版本：{getattr(anthropic, '__version__', '?')}")
          print("（下面只打印形态统计与 SDK 异常链，密钥内容已擦除）")
          for name, base_env, key_envs in TARGETS:
              base_raw = "https://api.anthropic.com" if not base_env else (os.getenv(base_env) or "")
              key_raw = ""
              key_from = None
              for env_name in key_envs:
                  value = os.getenv(env_name) or ""
                  if value.strip():
                      key_raw = value
                      key_from = env_name
                      break
              print(f"\n--- {name}（key 来自 {key_from or '未配置'}）")
              print(f"    base_url 形态：{shape(base_raw) if base_env else '（SDK 默认端点）'}")
              print(f"    key 形态     ：{shape(key_raw) if key_raw else '（未配置）'}")
              if not key_raw:
                  print("    → 未配置，跳过")
                  continue
              try:
                  client = anthropic.Anthropic(
                      api_key=key_raw,               # 有意不 strip：与 Tenshi 完全一致
                      base_url=base_raw or None,
                      max_retries=0,
                      timeout=15.0,
                  )
                  client.messages.create(
                      model="claude-haiku-4-5", max_tokens=1, messages=[{"role": "user", "content": "ping"}]
                  )
                  print("    → 调用成功（该通路的 secret 形态与网络都没问题）")
              except Exception as exc:  # noqa: BLE001
                  print(f"    → {type(exc).__name__}: {redact(str(exc))[:200]}")
                  cause = exc.__cause__
                  depth = 0
                  while cause is not None and depth < 3:
                      print(f"      cause[{depth}]: {type(cause).__name__}: {redact(str(cause))[:240]}")
                      cause = cause.__cause__
                      depth += 1
          PY

      - name: Compare host vs container
        if: always()
        run: |
          set -uo pipefail
          HOST_JSON="$REPORT_DIR/host/latest.json"
          CONTAINER_JSON="$REPORT_DIR/container/latest.json"
          if [ ! -f "$HOST_JSON" ]; then
            echo "::warning::宿主侧没有报告，跳过对照"
            exit 0
          fi
          if [ ! -f "$CONTAINER_JSON" ]; then
            echo "::warning::容器侧没有报告（登录/拉取/运行失败），对照报告只含宿主一侧"
            exit 0
          fi
          python3 scripts/claude_proxy_reachability.py \
            --compare "$HOST_JSON" "$CONTAINER_JSON" \
            --compare-out "$REPORT_DIR/compare.md"
          cat "$REPORT_DIR/compare.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to Step Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          for SIDE in host container; do
            if [ -f "$REPORT_DIR/$SIDE/latest.md" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$REPORT_DIR/$SIDE/latest.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ ! -f "$REPORT_DIR/host/latest.md" ] && [ ! -f "$REPORT_DIR/container/latest.md" ]; then
            echo "> ❌ 报告未生成（探测脚本异常退出），请查看本步骤之前的日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "$REPORT_DIR/host/latest.log" ]; then
            {
              echo ""
              echo "<details><summary>宿主侧完整日志（latest.log 尾部 120 行）</summary>"
              echo ""
              echo '```text'
              tail -n 120 "$REPORT_DIR/host/latest.log"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-proxy-reachability-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit report (best-effort)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.commit_report != 'false')
        run: |
          set -uo pipefail
          git config user.name "緋想天子"
          git config user.email "97383295+Hisou-Tenshi@users.noreply.github.com"

          DIR="$REPORT_DIR"
          if [ ! -d "$DIR" ]; then
            echo "本次没有产出报告目录（探测脚本未写出文件），跳过提交"
            exit 0
          fi

          git add -A "$DIR"
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
            exit 0
          fi

          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          VERDICTS="$(python3 - <<'PY'
          import json, os, pathlib
          base = pathlib.Path(os.environ.get("REPORT_DIR", "reports/claude-proxy-reachability"))
          parts = []
          for side in ("host", "container"):
              path = base / side / "latest.json"
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              env = (data.get("context") or {}).get("environment") or side
              items = [
                  f"{k}={v}"
                  for k, v in (data.get("verdicts") or {}).items()
                  if v != "not_configured"
              ]
              parts.append(f"{env}: " + (" ".join(items) or "无通路"))
          print(" ｜ ".join(parts) or "无结果")
          PY
          )"

          git commit -m "Claude 代理可达性检测：${STAMP}（${VERDICTS}） [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "报告已推送（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "推送失败，先 rebase 到远端最新再重试（第 ${attempt} 次）"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done

          # 报告推送失败不该掩盖探测结论本身，只报 warning
          echo "::warning::报告连续 3 次推送失败（检查 Actions 写权限或 REACHABILITY_TOKEN）"

      - name: Verdict
        if: always()
        env:
          HOST_EXIT: ${{ steps.probe.outputs.exit_code }}
          CONTAINER_EXIT: ${{ steps.probe_container.outputs.exit_code }}
        run: |
          set -uo pipefail
          host="${HOST_EXIT:-}"
          container="${CONTAINER_EXIT:-}"
          echo "宿主 runner 退出码：${host:-<未运行>}"
          echo "Tenshi 容器退出码：${container:-<未运行/被跳过>}"

          # 容器才是 Tenshi 的真实运行环境，它的结论优先
          if [ "$container" = "1" ]; then
            echo "::error::Tenshi 运行容器内存在不可用的 Claude 通路 —— 这正是运行时 Claude 全链失败的原因；详见 Step Summary / 对照报告"
            exit 1
          fi
          if [ "$host" = "1" ]; then
            echo "::error::宿主 runner 上存在不可用的 Claude 通路 —— 详见 Step Summary / 报告"
            exit 1
          fi
          if [ "$container" = "2" ] && [ "$host" = "2" ]; then
            echo "::warning::没有任何 Claude 通路被配置（secrets 缺失），本次未做检测。"
            exit 0
          fi
          for code in "$host" "$container"; do
            case "$code" in
              ""|0|1|2) ;;
              *) echo "::error::探测脚本异常退出（code=$code），请查看日志。"; exit 1 ;;
            esac
          done
          echo "✅ 两种环境下已配置的 Claude 通路全部可用。"
